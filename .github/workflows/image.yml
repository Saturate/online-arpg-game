name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Flux sorts on the trailing timestamp, since git SHAs have no order.
      - id: tag
        run: echo "ts=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_ID=${{ github.sha }}
          tags: |
            ghcr.io/saturate/online-arpg-game:latest
            ghcr.io/saturate/online-arpg-game:${{ github.sha }}
            ghcr.io/saturate/online-arpg-game:main-${{ github.sha }}-${{ steps.tag.outputs.ts }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
